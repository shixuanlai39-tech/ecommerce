<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>登入</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="js/app.js"></script>
</head>
<body>
    <div class="container">
        <h1>登入</h1>
        <form onsubmit="login(); return false;">
            <input type="text" id="username" placeholder="用戶名" class="form-control" required>
            <input type="password" id="password" placeholder="密碼" class="form-control" required>
            <button type="submit" class="btn btn-primary">登入</button>
        </form>
    </div>
</body>
</html>
