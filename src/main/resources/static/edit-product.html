<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>編輯商品</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 70px;
            background-color: #f8f9fa;
        }

        .navbar {
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }

        .drop-zone {
            border: 2px dashed #ccc;
            border-radius: 10px;
            padding: 40px;
            text-align: center;
            transition: all 0.3s;
            cursor: pointer;
        }

        .drop-zone.dragover {
            border-color: #007bff;
            background-color: #f0f8ff;
        }

        .error-text {
            color: #dc3545;
            font-size: 0.9em;
            margin-top: 5px;
        }

        #imagePreview {
            max-width: 100%;
            max-height: 300px;
            object-fit: contain;
        }
    </style>
</head>

<body onload="checkLogin(); loadProductForEdit();">

    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">電商平台</a>
            <div class="d-flex align-items-center" id="auth-area"></div>
        </div>
    </nav>

    <div class="container mt-4">
        <h3 class="mb-4">編輯商品</h3>

        <form onsubmit="updateProduct(); return false;" enctype="multipart/form-data">
            <!-- 唯一 productId -->
            <input type="hidden" id="productId">

            <div class="mb-3">
                <label class="form-label">名稱</label>
                <input type="text" id="name" class="form-control" required>
            </div>

            <div class="mb-3">
                <label class="form-label">價格</label>
                <input type="number" id="price" class="form-control" min="0" step="0.01" required>
            </div>

            <div class="mb-3">
                <label class="form-label">描述</label>
                <textarea id="description" class="form-control" rows="3"></textarea>
            </div>

            <!-- 圖片上傳區（唯一）-->
            <div class="mb-3">
                <label class="form-label">圖片（拖曳或點擊上傳）</label>
                <div id="dropZone" class="drop-zone">
                    <p class="text-muted mb-0">點擊或拖曳圖片至此</p>
                    <input type="file" id="imageInput" accept="image/*" style="display: none;">
                </div>
                <div id="imagePreviewContainer" class="mt-2"></div>
                <div id="uploadError" class="error-text"></div>
            </div>

            <div class="d-flex gap-2">
                <button type="submit" class="btn btn-primary">更新商品</button>
                <a href="index.html" class="btn btn-secondary">取消</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
</body>

</html>
