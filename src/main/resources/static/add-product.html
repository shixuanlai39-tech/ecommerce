<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>新增商品</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <script src="js/app.js"></script>
</head>
<body>
    <div class="container">
        <h1>新增商品</h1>
        <form onsubmit="addProduct(); return false;" enctype="multipart/form-data">
            <input type="text" id="name" placeholder="名稱" class="form-control" required>
            <input type="number" id="price" placeholder="價格" class="form-control" required>
            <textarea id="description" placeholder="描述" class="form-control" required></textarea>
            <input type="file" id="image" class="form-control">
            <button type="submit" class="btn btn-primary">新增</button>
        </form>
    </div>
</body>
</html>
