<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>電商平台</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 70px;
            background-color: #f8f9fa;
        }

        .navbar {
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }

        .product-card {
            transition: transform .2s;
        }

        .product-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0, 0, 0, .1);
        }

        .card-img-top {
            height: 200px;
            object-fit: cover;
        }

        .modal-header {
            border-bottom: none;
        }

        .modal-footer {
            border-top: none;
        }
    </style>
</head>

<body onload="checkLogin(); loadProducts();">

    <!-- 固定頂部導覽列 -->
    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">電商平台</a>
            <div class="d-flex align-items-center" id="auth-area">
                <!-- 按鈕由 JS 動態生成：登入 / 註冊 / 登出 -->
            </div>
        </div>
    </nav>

    <div class="container mt-4">

        <!-- 搜尋列 -->
        <div class="row mb-3">
            <div class="col-md-6">
                <input type="text" id="searchInput" class="form-control" placeholder="搜尋商品名稱..." autocomplete="off">
            </div>
        </div>

        <!-- 加入商品按鈕 -->
        <div class="text-end mb-3">
            <button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#addProductModal">
                加入商品
            </button>
        </div>

        <!-- 商品卡牌容器 -->
        <div class="row row-cols-1 row-cols-md-3 g-4" id="productContainer"></div>
    </div>

    <!-- 登入 Modal -->
    <div class="modal fade" id="loginModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">登入</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="loginUsername" class="form-control mb-2" placeholder="帳號">
                    <input type="password" id="loginPassword" class="form-control" placeholder="密碼">
                </div>
                <div class="text-end mt-2">
                    <a href="#" data-bs-toggle="modal" data-bs-target="#forgotPasswordModal"
                        onclick="bootstrap.Modal.getInstance(document.getElementById('loginModal')).hide()">
                        忘記密碼？
                    </a>
                </div>
                <div class="mb-3 form-check">
                    <input type="checkbox" class="form-check-input" id="rememberMe">
                    <label class="form-check-label" for="rememberMe">記住我</label>
                </div>
                <div class="modal-footer">
                    <button class="btn btn-primary w-100" onclick="login()">登入</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 註冊 Modal -->
    <div class="modal fade" id="registerModal" tabindex="-1">
        <div class="modal-dialog modal-sm">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">註冊</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="regUsername" class="form-control mb-2" placeholder="帳號">
                    <input type="password" id="regPassword" class="form-control mb-2" placeholder="密碼">
                    <input type="email" id="regEmail" class="form-control" placeholder="Email">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-success w-100" onclick="register()">註冊</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 忘記密碼 Modal -->
    <div class="modal fade" id="forgotPasswordModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">忘記密碼</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <p class="text-muted">請輸入您的帳號，我們將寄送密碼重設連結至您註冊的信箱。</p>
                    <div class="mb-3">
                        <label class="form-label">帳號</label>
                        <input type="text" id="resetUsername" class="form-control" placeholder="請輸入您的帳號" required>
                    </div>
                    <div id="resetMessage" class="mt-2"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" onclick="sendResetEmail()">送出</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 新增商品 Modal -->
    <div class="modal fade" id="addProductModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">加入商品</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <input type="text" id="name" class="form-control mb-2" placeholder="商品名稱">
                    <input type="number" id="price" class="form-control mb-2" placeholder="價格">
                    <textarea id="description" class="form-control mb-2" placeholder="描述"></textarea>
                    <input type="file" id="image" class="form-control" accept="image/*">
                </div>
                <div class="modal-footer">
                    <button class="btn btn-success w-100" onclick="addProduct()">確認新增</button>
                </div>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <!-- 您的 app.js -->
    <script src="js/app.js"></script>
</body>

</html>
