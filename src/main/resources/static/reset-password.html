<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <title>重設密碼</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card">
                    <div class="card-header"><h4>重設密碼</h4></div>
                    <div class="card-body">
                        <div class="mb-3">
                            <label>新密碼</label>
                            <input type="password" id="newPassword" class="form-control">
                        </div>
                        <div class="mb-3">
                            <label>確認密碼</label>
                            <input type="password" id="confirmPassword" class="form-control">
                        </div>
                        <button class="btn btn-success w-100" onclick="resetPassword()">確認送出</button>
                        <div id="message" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/app.js"></script>
    <script>
        function resetPassword() {
            const urlParams = new URLSearchParams(window.location.search);
            const token = urlParams.get('token');
            const newPass = document.getElementById('newPassword').value;
            const confirmPass = document.getElementById('confirmPassword').value;
            const msg = document.getElementById('message');

            if (newPass !== confirmPass) {
                msg.innerHTML = '<p class="text-danger">兩次密碼不一致</p>';
                return;
            }

            fetch('/api/users/reset-password', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token, newPassword: newPass })
            })
            .then(res => res.ok ? res.text() : res.text().then(t => { throw new Error(t) }))
            .then(m => {
                msg.innerHTML = `<p class="text-success">${m}</p>`;
                setTimeout(() => location.href = 'index.html', 2000);
            })
            .catch(err => msg.innerHTML = `<p class="text-danger">${err.message}</p>`);
        }
    </script>
</body>
</html>
