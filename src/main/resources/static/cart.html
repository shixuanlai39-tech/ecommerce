<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <title>購物車</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            padding-top: 70px;
        }

        .navbar {
            box-shadow: 0 2px 4px rgba(0, 0, 0, .1);
        }
    </style>
</head>

<body onload="checkLogin(); loadCart();">

    <nav class="navbar navbar-expand-lg navbar-light bg-white fixed-top">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="index.html">電商平台</a>
            <div class="d-flex align-items-center" id="auth-area"></div>
        </div>
    </nav>

    <div class="container mt-4">
        <h3>購物車</h3>
        <table class="table align-middle" id="cartTable">
            <thead class="table-dark">
                <tr>
                    <th>商品</th>
                    <th style="width: 150px;">數量</th>
                    <th>小計</th>
                    <th style="width: 100px;">操作</th>
                </tr>
            </thead>
            <tbody>
                <!-- JS 會動態填入商品 -->
            </tbody>
            <tfoot>
                <tr>
                    <td colspan="3" class="text-end fw-bold">總計：</td>
                    <td id="cartTotal" class="fw-bold text-danger">$0</td>
                </tr>
            </tfoot>
        </table>
    </div>

    <div class="text-end mt-3">
        <button class="btn btn-outline-danger me-2" onclick="clearCart()">清空購物車</button>
        <button class="btn btn-success btn-lg" onclick="checkout()">結帳</button>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    
    <!-- 您的 app.js（包含 loadCart、updateQuantity 等函式） -->
    <script src="js/app.js"></script>

</body>

</html>
